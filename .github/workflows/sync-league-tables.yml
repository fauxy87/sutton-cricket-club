name: Sync Play-Cricket league tables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-league-tables.yml'
      - 'data/play-cricket.json'
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Download league tables
        env:
          PLAY_CRICKET_API_TOKEN: ${{ secrets.PLAY_CRICKET_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ.get('PLAY_CRICKET_API_TOKEN', '').strip()
          if not token:
              raise SystemExit('Missing repository secret PLAY_CRICKET_API_TOKEN')

          season = datetime.now(timezone.utc).year
          base = 'https://www.play-cricket.com/api/v2'
          source_path = Path('data/play-cricket.json')
          if not source_path.exists():
              raise SystemExit('data/play-cricket.json is missing; run the main Play-Cricket sync first')

          source = json.loads(source_path.read_text(encoding='utf-8'))

          def get(endpoint, params=None):
              params = dict(params or {})
              params['api_token'] = token
              url = f"{base}/{endpoint}?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url, headers={'User-Agent':'Sutton-CC-Website/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          targets = {
              '1st': {
                  'team_id': '63723',
                  'competition_name': 'CCA Junior League 2 North',
              },
              '2nd': {
                  'team_id': '63724',
                  'competition_name': 'CCA Junior League 4 North',
              },
          }

          rows = []
          for key in ('matches', 'results'):
              value = source.get(key, [])
              if isinstance(value, list):
                  rows.extend(value)

          found = {}
          for key, target in targets.items():
              wanted_team = target['team_id']
              wanted_comp = target['competition_name'].lower()
              for row in rows:
                  if str(row.get('season') or season) != str(season):
                      continue
                  team_ids = {
                      str(row.get('home_team_id') or ''),
                      str(row.get('away_team_id') or ''),
                  }
                  comp_name = str(row.get('competition_name') or '').strip()
                  comp_id = row.get('competition_id') or row.get('division_id')
                  if wanted_team in team_ids and wanted_comp == comp_name.lower() and comp_id:
                      found[key] = {
                          'division_id': str(comp_id),
                          'division_name': comp_name,
                          'league_id': str(row.get('league_id') or ''),
                          'league_name': str(row.get('league_name') or ''),
                          'source': 'play-cricket.json competition_id',
                      }
                      break

          tables = {}
          for key, target in targets.items():
              info = found.get(key)
              if not info:
                  tables[key] = {
                      'target': target['competition_name'],
                      'error': 'Division not found in Sutton match data',
                  }
                  continue

              try:
                  raw = get('league_table.json', {'division_id': info['division_id']})
                  league_tables = raw.get('league_table') or raw.get('league_tables') or []
                  if isinstance(league_tables, dict):
                      table = league_tables
                  elif league_tables:
                      table = league_tables[0]
                  else:
                      table = raw

                  headings = table.get('headings') or raw.get('headings') or {}
                  values = table.get('values') or raw.get('values') or []
                  if not values:
                      raise RuntimeError('League table API returned no rows')

                  tables[key] = {
                      **info,
                      'target': target['competition_name'],
                      'name': table.get('name') or raw.get('name') or info['division_name'],
                      'headings': headings,
                      'values': values,
                      'key': table.get('key') or raw.get('key') or '',
                  }
              except Exception as exc:
                  tables[key] = {
                      **info,
                      'target': target['competition_name'],
                      'error': f'{type(exc).__name__}: {exc}',
                  }

          payload = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'season': season,
              'tables': tables,
              'division_source': 'Existing Sutton Play-Cricket match data',
          }
          out = Path('data/league-tables.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          summary = {
              k: {
                  'division_id': v.get('division_id'),
                  'rows': len(v.get('values', [])),
                  'error': v.get('error'),
              }
              for k, v in tables.items()
          }
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit refreshed tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league-tables.json
          if git diff --cached --quiet; then
            echo "No league table changes"
            exit 0
          fi
          git commit -m "Update Play-Cricket league tables"
          git push
