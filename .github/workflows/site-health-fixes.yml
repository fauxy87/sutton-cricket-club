name: Site health fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-health-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe site health fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          for page in sorted(Path('.').glob('*.html')):
              text = page.read_text(encoding='utf-8')
              original = text

              # Every HTML document should declare its language.
              if re.search(r'<html(?![^>]*\blang=)', text, re.I):
                  text = re.sub(r'<html(?![^>]*\blang=)([^>]*)>', r'<html lang="en"\1>', text, count=1, flags=re.I)

              # Reuse the existing Open Graph description when the normal
              # search-engine description is missing.
              if not re.search(r'<meta\s+name=["\']description["\']', text, re.I):
                  m = re.search(r'<meta\s+property=["\']og:description["\']\s+content=["\']([^"\']*)["\']\s*/?>', text, re.I)
                  if m:
                      desc = m.group(1)
                      insertion = f'<meta name="description" content="{desc}">\n'
                      title_pos = re.search(r'<title\b', text, re.I)
                      if title_pos:
                          text = text[:title_pos.start()] + insertion + text[title_pos.start():]

              # Mobile menu buttons need an accessible name and state.
              def fix_button(match):
                  tag = match.group(0)
                  if not re.search(r'\baria-label=', tag, re.I):
                      tag = tag[:-1] + ' aria-label="Open menu">'
                  if not re.search(r'\baria-expanded=', tag, re.I):
                      tag = tag[:-1] + ' aria-expanded="false">'
                  return tag
              text = re.sub(r'<button\b[^>]*class=["\'][^"\']*\bnav-toggle\b[^"\']*["\'][^>]*>', fix_button, text, flags=re.I)

              # New-tab links should not expose window.opener.
              def fix_blank(match):
                  tag = match.group(0)
                  if not re.search(r'\brel=', tag, re.I):
                      tag = tag[:-1] + ' rel="noopener">'
                  elif 'noopener' not in tag.lower():
                      tag = re.sub(r'rel=(["\'])(.*?)\1', lambda m: f'rel={m.group(1)}{m.group(2)} noopener{m.group(1)}', tag, count=1, flags=re.I)
                  return tag
              text = re.sub(r'<a\b[^>]*target=["\']_blank["\'][^>]*>', fix_blank, text, flags=re.I)

              if text != original:
                  page.write_text(text, encoding='utf-8')
                  changed.append(page.name)

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Improve site metadata and accessibility"
          git pull --rebase origin main
          git push origin HEAD:main
