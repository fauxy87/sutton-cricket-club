name: Site launch audit

on:
  push:
    paths:
      - '.github/workflows/site-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete homepage stylesheet reference
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  <link rel="stylesheet" href="home-middle.css" />\n', '')
          path.write_text(text, encoding='utf-8')

      - name: Check internal links and assets
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import sys

          root = Path('.')
          files = {p.as_posix() for p in root.rglob('*') if p.is_file()}
          broken = []

          class Parser(HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for attr in ('href','src'):
                      value = attrs.get(attr)
                      if not value:
                          continue
                      value = value.strip()
                      if value.startswith(('#','mailto:','tel:','javascript:','data:')):
                          continue
                      parsed = urlparse(value)
                      if parsed.scheme or parsed.netloc:
                          continue
                      path = parsed.path
                      if not path:
                          continue
                      if path.startswith('/'):
                          path = path.lstrip('/')
                          prefix = 'sutton-cricket-club/'
                          if path.startswith(prefix):
                              path = path[len(prefix):]
                      else:
                          path = (self.page.parent / path).as_posix()
                      while path.startswith('./'):
                          path = path[2:]
                      if path.endswith('/'):
                          path += 'index.html'
                      if path not in files:
                          broken.append((self.page.as_posix(), tag, attr, value, path))

          html_pages = sorted(root.glob('*.html'))
          for page in html_pages:
              parser = Parser(page)
              parser.feed(page.read_text(encoding='utf-8'))

          required = [
              'index.html','404.html','styles.css','script.js','site.webmanifest',
              'robots.txt','sitemap.xml','assets/sutton-cc-badge.png',
              'data/play-cricket.json','data/player-stats.json','data/league-tables.json'
          ]
          for item in required:
              if item not in files:
                  broken.append(('REQUIRED', 'file', 'missing', item, item))

          print(f'Checked {len(html_pages)} HTML pages and {len(files)} repository files.')
          if broken:
              print('\nBroken internal references:')
              for row in broken:
                  print(' | '.join(row))
              sys.exit(1)
          print('No broken internal links or asset references found.')

      - name: Commit audit fix
        run: |
          if git diff --quiet; then
            echo "No fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove obsolete homepage stylesheet reference"
          git pull --rebase origin main
          git push origin HEAD:main
