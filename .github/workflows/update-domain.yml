name: Update site domain references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-domain.yml'

permissions:
  contents: write

jobs:
  update-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old GitHub Pages domain
        shell: bash
        run: |
          old='https://fauxy87.github.io/sutton-cricket-club'
          new='https://www.suttoncambscc.co.uk'
          while IFS= read -r -d '' file; do
            if [ "$file" = '.github/workflows/update-domain.yml' ]; then
              continue
            fi
            sed -i "s#${old}#${new}#g" "$file"
          done < <(git grep -Ilz "$old" || true)

      - name: Commit updated domain references
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No old domain references found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use suttoncambscc.co.uk as official site domain'
          git push
