name: Add club social links

on:
  push:
    paths:
      - '.github/workflows/add-social-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add social links to contact page and footer
        shell: python
        run: |
          from pathlib import Path

          join = Path('join.html')
          text = join.read_text(encoding='utf-8')
          old = '<a class="btn btn-primary" href="https://suttoncc.play-cricket.com/" target="_blank" rel="noopener">Open Play-Cricket →</a></div></div></section>'
          new = '''<a class="btn btn-primary" href="https://suttoncc.play-cricket.com/" target="_blank" rel="noopener">Open Play-Cricket →</a><div class="contact-socials" aria-label="Sutton Cricket Club social media"><a href="https://www.facebook.com/suttoncricketclub" target="_blank" rel="noopener">Facebook</a><a href="https://www.instagram.com/suttoncricketclub1887/" target="_blank" rel="noopener">Instagram</a><a href="https://x.com/SuttonCCcambs" target="_blank" rel="noopener">X</a></div></div></div></section>'''
          if 'contact-socials' not in text:
              if old not in text:
                  raise SystemExit('Could not find contact panel insertion point')
              text = text.replace(old, new)
              join.write_text(text, encoding='utf-8')

          script = Path('script.js')
          js = script.read_text(encoding='utf-8')
          marker = '/* Sutton CC social links */'
          if marker not in js:
              js += '''\n\n/* Sutton CC social links */\n(() => {\n  const footerContainer = document.querySelector('footer .container');\n  if (!footerContainer || footerContainer.querySelector('.site-social-links')) return;\n  const social = document.createElement('nav');\n  social.className = 'site-social-links';\n  social.setAttribute('aria-label', 'Sutton Cricket Club social media');\n  social.innerHTML = '<a href="https://www.facebook.com/suttoncricketclub" target="_blank" rel="noopener">Facebook</a><a href="https://www.instagram.com/suttoncricketclub1887/" target="_blank" rel="noopener">Instagram</a><a href="https://x.com/SuttonCCcambs" target="_blank" rel="noopener">X</a>';\n  footerContainer.appendChild(social);\n})();\n'''
              script.write_text(js, encoding='utf-8')

          styles = Path('styles.css')
          css = styles.read_text(encoding='utf-8')
          css_marker = '/* Club social links */'
          if css_marker not in css:
              css += '''\n\n/* Club social links */\n.site-social-links{display:flex;gap:8px;flex-wrap:wrap;margin-left:18px}\n.site-social-links a,.contact-socials a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 12px;border-radius:999px;font-weight:800;font-size:.84rem}\n.site-social-links a{border:1px solid rgba(255,255,255,.18);color:#fff;background:rgba(255,255,255,.06)}\n.site-social-links a:hover,.site-social-links a:focus-visible{background:var(--yellow);color:var(--dark);border-color:var(--yellow)}\n.contact-socials{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}\n.contact-socials a{border:1px solid var(--line);background:#f7f9f7;color:var(--green)}\n.contact-socials a:hover,.contact-socials a:focus-visible{background:var(--green);color:#fff;border-color:var(--green)}\n@media(max-width:850px){.site-social-links{margin:14px 0 0;gap:7px}.site-social-links a{min-height:38px;padding:7px 11px}}\n'''
              styles.write_text(css, encoding='utf-8')

      - name: Commit social links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add join.html script.js styles.css
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Add club social links"
          git pull --rebase origin main
          git push origin HEAD:main
