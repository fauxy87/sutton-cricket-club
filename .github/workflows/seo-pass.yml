name: SEO finishing pass

on:
  push:
    paths:
      - '.github/workflows/seo-pass.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add manifest, theme colour and canonical links
        shell: python
        run: |
          from pathlib import Path
          import re

          ROOT = "https://fauxy87.github.io/sutton-cricket-club/"

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text
              additions = []

              if 'rel="manifest"' not in text and "rel='manifest'" not in text:
                  additions.append('<link rel="manifest" href="site.webmanifest">')

              if 'name="theme-color"' not in text and "name='theme-color'" not in text:
                  additions.append('<meta name="theme-color" content="#0b5d31">')

              if 'rel="canonical"' not in text and "rel='canonical'" not in text:
                  url = ROOT if path.name == 'index.html' else ROOT + path.name
                  additions.append(f'<link rel="canonical" href="{url}">')

              if additions:
                  viewport = re.search(r'<meta\s+name=["\']viewport["\'][^>]*>', text, re.I)
                  if viewport:
                      pos = viewport.end()
                      text = text[:pos] + '\n' + '\n'.join(additions) + text[pos:]
                  else:
                      text = text.replace('<head>', '<head>\n' + '\n'.join(additions), 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('Updated', path)

      - name: Commit SEO updates
        run: |
          if git diff --quiet; then
            echo "No SEO changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Add manifest theme colour and canonical links"
          git pull --rebase origin main
          git push origin HEAD:main
