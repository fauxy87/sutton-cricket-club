name: Add site metadata

on:
  push:
    paths:
      - '.github/workflows/add-site-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add favicon and social metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          ROOT_URL = "https://fauxy87.github.io/sutton-cricket-club/"
          OG_IMAGE = ROOT_URL + "assets/sutton-cc-badge.png?v=20260912c"
          DEFAULT_DESC = "Senior, women’s and junior cricket in Sutton, Cambridgeshire. Founded 1877."

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text

              title_match = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
              title = re.sub(r'\s+', ' ', title_match.group(1)).strip() if title_match else 'Sutton Cricket Club'

              desc_match = re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']\s*/?>', text, re.I | re.S)
              desc = re.sub(r'\s+', ' ', desc_match.group(1)).strip() if desc_match else DEFAULT_DESC

              page_url = ROOT_URL if path.name == 'index.html' else ROOT_URL + path.name

              additions = []
              if 'rel="icon"' not in text and "rel='icon'" not in text:
                  additions.append('<link rel="icon" type="image/png" href="assets/sutton-cc-badge.png?v=20260912c">')
              if 'rel="apple-touch-icon"' not in text and "rel='apple-touch-icon'" not in text:
                  additions.append('<link rel="apple-touch-icon" href="assets/sutton-cc-badge.png?v=20260912c">')
              if 'property="og:title"' not in text and "property='og:title'" not in text:
                  additions.extend([
                      '<meta property="og:type" content="website">',
                      '<meta property="og:site_name" content="Sutton Cricket Club">',
                      f'<meta property="og:title" content="{title}">',
                      f'<meta property="og:description" content="{desc}">',
                      f'<meta property="og:url" content="{page_url}">',
                      f'<meta property="og:image" content="{OG_IMAGE}">',
                      '<meta property="og:image:alt" content="Sutton Cricket Club badge">',
                      '<meta name="twitter:card" content="summary">',
                      f'<meta name="twitter:title" content="{title}">',
                      f'<meta name="twitter:description" content="{desc}">',
                      f'<meta name="twitter:image" content="{OG_IMAGE}">',
                  ])

              if additions:
                  marker = re.search(r'<meta\s+name=["\']viewport["\'][^>]*>', text, re.I)
                  if marker:
                      pos = marker.end()
                      text = text[:pos] + '\n' + '\n'.join(additions) + text[pos:]
                  else:
                      text = text.replace('<head>', '<head>\n' + '\n'.join(additions), 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('Updated', path)

      - name: Commit metadata
        run: |
          if git diff --quiet; then
            echo "No metadata changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Add favicon and social sharing metadata"
          git push
