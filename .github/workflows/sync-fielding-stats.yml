name: Sync fielding dismissals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-fielding-stats.yml'
      - 'data/play-cricket-scorecards.json'
      - 'data/player-stats.json'
  schedule:
    - cron: '25 */6 * * *'

permissions:
  contents: write

jobs:
  fielding:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v5

      - name: Calculate catches and stumpings
        run: |
          python - <<'PY'
          import json, re
          from collections import defaultdict
          from pathlib import Path

          scorecards_path = Path('data/play-cricket-scorecards.json')
          stats_path = Path('data/player-stats.json')
          if not scorecards_path.exists() or not stats_path.exists():
              raise SystemExit('Required Play-Cricket data files are missing')

          cache = json.loads(scorecards_path.read_text(encoding='utf-8'))
          stats = json.loads(stats_path.read_text(encoding='utf-8'))
          season = str(stats.get('season') or '')
          site_id = '6168'

          fielders = defaultdict(lambda: {'name':'', 'catches':0, 'stumpings':0, 'run_outs':0})
          # Match Detail can expose a fielder ID but no name. Build a Sutton player
          # lookup from batting/bowling rows so those dismissals are not left as
          # anonymous/"Unsure" entries.
          player_names = {}

          def text(v):
              return str(v or '').strip()

          def first(row, keys):
              for key in keys:
                  value = row.get(key)
                  if value not in (None, ''):
                      return text(value)
              return ''

          def add_dismissal(row, kind):
              if kind == 'stumping':
                  pid = first(row, ['fielder_id','wicket_keeper_id','wicketkeeper_id','dismissal_fielder_id'])
                  name = first(row, ['fielder_name','wicket_keeper_name','wicketkeeper_name','dismissal_fielder_name'])
              else:
                  pid = first(row, ['fielder_id','dismissal_fielder_id','catcher_id'])
                  name = first(row, ['fielder_name','dismissal_fielder_name','catcher_name'])

              how = first(row, ['how_out','dismissal','dismissal_text'])
              if kind == 'catch' and not (pid or name) and any(x in how.lower() for x in ['caught & bowled','caught and bowled','c & b','c&b']):
                  pid = first(row, ['bowler_id'])
                  name = first(row, ['bowler_name'])

              if not (pid or name):
                  return
              key = pid or name.lower()
              f = fielders[key]
              f['name'] = name or player_names.get(pid, '') or f['name'] or pid
              if kind == 'stumping':
                  f['stumpings'] += 1
              elif kind == 'run_out':
                  f['run_outs'] += 1
              else:
                  f['catches'] += 1

          matches = cache.get('matches', {}) if isinstance(cache, dict) else {}

          for entry in matches.values():
              if not isinstance(entry, dict):
                  continue
              details = entry.get('detail', {}).get('match_details', []) or []
              if not details:
                  continue
              d = details[0]
              if season and text(d.get('season') or season) != season:
                  continue
              if not (text(d.get('home_club_id')) == site_id or text(d.get('away_club_id')) == site_id):
                  continue
              for inn in d.get('innings', []) or []:
                  for batter in inn.get('bat', []) or []:
                      pid = first(batter, ['batsman_id'])
                      name = first(batter, ['batsman_name'])
                      if pid and name:
                          player_names[pid] = name
                  for bowler in inn.get('bowl', []) or []:
                      pid = first(bowler, ['bowler_id'])
                      name = first(bowler, ['bowler_name'])
                      if pid and name:
                          player_names[pid] = name
          for entry in matches.values():
              if not isinstance(entry, dict):
                  continue
              details = entry.get('detail', {}).get('match_details', []) or []
              if not details:
                  continue
              d = details[0]
              if season and text(d.get('season') or season) != season:
                  continue
              home_is_sutton = text(d.get('home_club_id')) == site_id
              away_is_sutton = text(d.get('away_club_id')) == site_id
              if not (home_is_sutton or away_is_sutton):
                  continue
              sutton_team_ids = set()
              if home_is_sutton: sutton_team_ids.add(text(d.get('home_team_id')))
              if away_is_sutton: sutton_team_ids.add(text(d.get('away_team_id')))
              sutton_team_ids.discard('')

              for inn in d.get('innings', []) or []:
                  batting_id = text(inn.get('team_batting_id'))
                  # Fielding dismissals belong to Sutton whenever the batting side
                  # is not the only Sutton side in the match. For Sutton v Sutton,
                  # the other Sutton team is fielding, so include both innings.
                  if batting_id in sutton_team_ids and len(sutton_team_ids) == 1:
                      continue
                  for batter in inn.get('bat', []) or []:
                      how = first(batter, ['how_out','dismissal','dismissal_text']).lower()
                      if not how:
                          continue

                      # Match Detail exposes fielder_name/fielder_id separately. Some
                      # scorecards use short dismissal codes (ct/st) rather than words,
                      # so prefer the fielder fields and only use how_out to classify.
                      has_fielder = bool(first(batter, ['fielder_id','fielder_name','dismissal_fielder_id','dismissal_fielder_name','catcher_id','catcher_name']))
                      is_run_out = 'run out' in how or how in ('ro','runout')
                      is_stumping = 'stump' in how or how in ('st','stumped')
                      is_caught_bowled = any(x in how for x in ['caught & bowled','caught and bowled','c & b','c&b']) or how in ('cb','c b')
                      is_catch = ('caught' in how or how in ('ct','c','catch') or re.search(r'(^|\s)c\s', how) or is_caught_bowled)

                      if is_run_out:
                          add_dismissal(batter, 'run_out')
                      elif is_stumping:
                          add_dismissal(batter, 'stumping')
                      elif is_catch or has_fielder:
                          add_dismissal(batter, 'catch')

          rows = []
          for pid, f in fielders.items():
              # Resolve ID-only fielders after all scorecards have been scanned.
              if (not f['name'] or f['name'] == pid or f['name'].lower() == 'unsure') and pid in player_names:
                  f['name'] = player_names[pid]
              # Do not publish unresolved fielders. Their dismissals remain in the
              # source scorecards and will be picked up automatically if Play-Cricket
              # later provides a usable player ID/name.
              unresolved = (not f['name'] or f['name'] == pid or f['name'].strip().lower() in ('unsure', 'unknown')) and str(pid).strip().lower() in ('unsure', 'unknown', '')
              if unresolved:
                  continue
              dismissals = f['catches'] + f['stumpings'] + f['run_outs']
              if dismissals:
                  rows.append({
                      'player_id': pid,
                      'name': f['name'],
                      'catches': f['catches'],
                      'stumpings': f['stumpings'],
                      'run_outs': f['run_outs'],
                      'dismissals': dismissals
                  })
          rows.sort(key=lambda x: (x['dismissals'], x['catches'], x['stumpings']), reverse=True)
          stats['fielding'] = rows
          stats_path.write_text(json.dumps(stats, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'Added fielding statistics for {len(rows)} players')
          PY

      - name: Commit fielding statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player-stats.json
          if git diff --cached --quiet; then
            echo "No fielding statistic changes"
            exit 0
          fi
          git commit -m "Update Play-Cricket fielding stats"
          git push
