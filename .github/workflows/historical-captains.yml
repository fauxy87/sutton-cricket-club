name: Historical Sutton CC Captains (2009–2026)

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First season to check
        required: true
        default: '2009'
        type: string
      end_year:
        description: Last season to check
        required: true
        default: '2026'
        type: string

permissions:
  contents: read

jobs:
  extract:
    name: Extract captains for manual review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAY_CRICKET_API_TOKEN: ${{ secrets.PLAY_CRICKET_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check API credentials
        shell: bash
        run: |
          if [ -z "$PLAY_CRICKET_API_TOKEN" ]; then
            echo "::error::Missing PLAY_CRICKET_API_TOKEN repository secret. Add the existing authorised Play-Cricket API token in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Validate requested season range
        shell: bash
        env:
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: |
          if ! [[ "$START_YEAR" =~ ^20[0-9][0-9]$ && "$END_YEAR" =~ ^20[0-9][0-9]$ ]] || [ "$START_YEAR" -gt "$END_YEAR" ]; then
            echo "::error::Enter a valid season range, e.g. 2009 to 2026."
            exit 1
          fi
      - name: Extract Play-Cricket captain candidates
        env:
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: python3 tools/extract-historical-captains.py --site-id 6168 --start "$START_YEAR" --end "$END_YEAR" --output captains-research
      - name: Attach downloadable CSV research files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sutton-captains-research
          path: captains-research/*.csv
          if-no-files-found: warn
          retention-days: 30
